{{- if .Values.autoscaling.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "backend-dev.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "backend-dev.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "backend-dev.fullname" . }}
  pollingInterval: {{ .Values.autoscaling.keda.pollingInterval | default 30 }}
  cooldownPeriod: {{ .Values.autoscaling.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.autoscaling.keda.minReplicaCount | default 1 }}
  maxReplicaCount: {{ .Values.autoscaling.keda.maxReplicaCount | default 10 }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.autoscaling.keda.prometheus.serverAddress | quote }}
        metricName: socketio_active_connections
        query: {{ .Values.autoscaling.keda.prometheus.query | quote }}
        threshold: {{ .Values.autoscaling.keda.prometheus.threshold | quote }}
{{- end }}

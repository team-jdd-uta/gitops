apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rtmp-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: rtmp-secret
    creationPolicy: Owner
  data:
    - secretKey: RTMP_CALLBACK_SECRET
      remoteRef:
        key: team9-mini/dev/backend/rtmp
        property: RTMP_CALLBACK_SECRET

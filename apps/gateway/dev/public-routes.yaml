apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team9-public-routes
  namespace: backend
spec:
  parentRefs:
    - name: team9-api-gateway
  hostnames:
    - api.team9.cloud.skala-ai.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/login
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /login
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /auth/register
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /register
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /auth/refresh
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /refresh
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /api/room/rooms
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /api/room/rooms
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-room-service
          port: 8082
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /api/user/comments/room
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /api/user/comments/room
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-user-service
          port: 8084
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /api/chat-history
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /api/chat-history
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-redis-stream-mongo-consumer
          port: 3010
    - matches:
        - path:
            type: PathPrefix
            value: /api/socket
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-socket-io-gateway
          port: 3000
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /health
        - method: OPTIONS
          path:
            type: PathPrefix
            value: /health
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-auth-service
          port: 8088

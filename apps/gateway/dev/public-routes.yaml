apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team9-public-routes
  namespace: backend
spec:
  parentRefs:
    - name: team9-api-gateway
  hostnames:
    - api.team9.cloud.skala-ai.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/login
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /login
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /auth/register
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /register
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /auth/refresh
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /refresh
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /api/room/rooms
      backendRefs:
        - name: backend-room-service
          port: 8082
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /api/user/comments/room
      backendRefs:
        - name: backend-user-service
          port: 8084
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /api/chat-history
      backendRefs:
        - name: backend-redis-stream-mongo-consumer
          port: 3010
    - matches:
        - path:
            type: PathPrefix
            value: /api/socket
      backendRefs:
        - name: backend-socket-io-gateway
          port: 3000
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: backend-auth-service
          port: 8088

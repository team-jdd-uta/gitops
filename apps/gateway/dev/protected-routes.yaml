apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team9-protected-routes
  namespace: backend
spec:
  parentRefs:
    - name: team9-api-gateway
  hostnames:
    - api.team9.cloud.skala-ai.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/logout
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /logout
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /api/user
      backendRefs:
        - name: backend-user-service
          port: 8084
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /api/room/rooms
        - method: PUT
          path:
            type: PathPrefix
            value: /api/room/rooms
        - method: DELETE
          path:
            type: PathPrefix
            value: /api/room/rooms
      backendRefs:
        - name: backend-room-service
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/chat
      backendRefs:
        - name: backend-chat-service
          port: 8083

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team9-protected-routes
  namespace: backend
spec:
  parentRefs:
    - name: team9-api-gateway
  hostnames:
    - api.team9.cloud.skala-ai.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/logout
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with, x-user-id]
            allowCredentials: true
            maxAge: 1800
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /logout
      backendRefs:
        - name: backend-login-service
          port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /api/user
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with, x-user-id]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-user-service
          port: 8084
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /api/room/rooms
        - method: PUT
          path:
            type: PathPrefix
            value: /api/room/rooms
        - method: DELETE
          path:
            type: PathPrefix
            value: /api/room/rooms
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with, x-user-id]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-room-service
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/chat
      filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://front.team9.cloud.skala-ai.com
              - https://d2fwb6om3m5abf.cloudfront.net
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowHeaders: [authorization, content-type, x-requested-with, x-user-id]
            allowCredentials: true
            maxAge: 1800
      backendRefs:
        - name: backend-chat-service
          port: 8083

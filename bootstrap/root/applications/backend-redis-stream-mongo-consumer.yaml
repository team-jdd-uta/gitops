apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-redis-stream-mongo-consumer-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-redis-stream-mongo-consumer
      values: |
        nameOverride: backend-redis-stream-mongo-consumer
        fullnameOverride: backend-redis-stream-mongo-consumer
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-redis-stream-mongo-consumer
          tag: latest
        service:
          port: 3010
        containerPort: 3010
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/group.name: team9-backend-dev
            alb.ingress.kubernetes.io/group.order: "60"
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            external-dns.alpha.kubernetes.io/hostname: backend.team9.cloud.skala-ai.com
          hosts:
            - host: backend.team9.cloud.skala-ai.com
              paths:
                - path: /api/chat-history
                  pathType: Prefix
          tls: []
        env:
          - name: PORT
            value: "3010"
        envFromSecretRefs:
          - backend-redis-stream-mongo-consumer-secret
        externalSecret:
          enabled: true
          targetName: backend-redis-stream-mongo-consumer-secret
          remoteKey: team9-mini/dev/backend/redis-stream-mongo-consumer
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

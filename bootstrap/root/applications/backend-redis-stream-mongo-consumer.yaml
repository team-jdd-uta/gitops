apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-redis-stream-mongo-consumer-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-redis-stream-mongo-consumer
      values: |
        nameOverride: backend-redis-stream-mongo-consumer
        fullnameOverride: backend-redis-stream-mongo-consumer
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-redis-stream-mongo-consumer
          tag: 210f720ac9f1
        service:
          port: 3010
        containerPort: 3010
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/group.name: team9-backend-dev
            alb.ingress.kubernetes.io/group.order: "60"
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            external-dns.alpha.kubernetes.io/hostname: backend.team9.cloud.skala-ai.com
          hosts:
            - host: backend.team9.cloud.skala-ai.com
              paths:
                - path: /api/chat-history
                  pathType: Prefix
          tls: []
        env:
          - name: PORT
            value: "3010"
          - name: CORS_ALLOWED_ORIGINS
            value: https://front.team9.cloud.skala-ai.com,http://localhost:5173,http://127.0.0.1:5173
          - name: REDIS_URL
            value: redis://keepinlinedevredis-0001-001.keepinlinedevredis.1spwho.apn2.cache.amazonaws.com:6379
          - name: SUMMARY_SERVICE_URL
            value: http://ai-chat-summary:8000
          - name: SUMMARY_AUTO_ENABLED
            value: "false"
          - name: SUMMARY_MANUAL_WINDOW_MINUTES
            value: "5"
          - name: SUMMARY_MANUAL_MIN_MESSAGES
            value: "10"
          - name: SUMMARY_MANUAL_MAX_MESSAGES
            value: "100"
          - name: ROOM_SERVICE_URL
            value: http://backend-room-service:8082/api/room
        envFromSecretRefs:
          - backend-redis-stream-mongo-consumer-secret
        externalSecret:
          enabled: true
          targetName: backend-redis-stream-mongo-consumer-secret
          remoteKey: team9-mini/dev/backend/redis-stream-mongo-consumer
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

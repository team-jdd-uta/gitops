apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-login-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-login-service
      values: |
        nameOverride: backend-login-service
        fullnameOverride: backend-login-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-login-service
          tag: 2da7c83998c4-cors
        containerPort: 8081
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:881490135253:certificate/15fce3b8-43ed-4555-8d9a-837375603b2e
            external-dns.alpha.kubernetes.io/hostname: login.team9.cloud.skala-ai.com
          hosts:
            - host: login.team9.cloud.skala-ai.com
              paths:
                - path: /
                  pathType: Prefix
        serviceAccount:
          create: true
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::881490135253:role/team9-mini-dev-login-service-cognito
        envFromSecretRefs:
          - backend-login-service-secret
        externalSecret:
          enabled: true
          targetName: backend-login-service-secret
          remoteKey: team9-mini/dev/backend/login-service
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

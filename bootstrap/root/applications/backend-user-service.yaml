apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-user-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-user-service
      values: |
        nameOverride: backend-user-service
        fullnameOverride: backend-user-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-user-service
          tag: latest
        deploymentAnnotations:
          secret.reloader.stakater.com/reload: backend-user-service-secret
        service:
          port: 8084
        containerPort: 8084
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:881490135253:certificate/15fce3b8-43ed-4555-8d9a-837375603b2e
            alb.ingress.kubernetes.io/success-codes: "200-499"
            alb.ingress.kubernetes.io/group.name: team9-backend-dev
            alb.ingress.kubernetes.io/group.order: "20"
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            external-dns.alpha.kubernetes.io/hostname: backend.team9.cloud.skala-ai.com
          hosts:
            - host: backend.team9.cloud.skala-ai.com
              paths:
                - path: /api/user
                  pathType: Prefix
          tls: []
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: dev
          - name: SERVER_CONTEXT_PATH
            value: /api/user
          - name: CORS_ALLOWED_ORIGINS
            value: https://front.team9.cloud.skala-ai.com,http://localhost:5173,http://127.0.0.1:5173
        envFromSecretRefs:
          - backend-user-service-secret
        externalSecret:
          enabled: true
          targetName: backend-user-service-secret
          remoteKey: team9-mini/dev/backend/user-service
          data:
            - secretKey: DB_USER
              remoteRef:
                key: team9-mini-dev-db-01-credentials
                property: username
            - secretKey: DB_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-01-credentials
                property: password
            - secretKey: DB_USER_SHARD2
              remoteRef:
                key: team9-mini-dev-db-01-credentials
                property: username
            - secretKey: DB_PASSWORD_SHARD2
              remoteRef:
                key: team9-mini-dev-db-01-credentials
                property: password
            - secretKey: SPRING_DATASOURCE_USERNAME
              remoteRef:
                key: team9-mini-dev-db-01-credentials
                property: username
            - secretKey: SPRING_DATASOURCE_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-01-credentials
                property: password
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

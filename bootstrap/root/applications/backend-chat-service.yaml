apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-chat-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-chat-service
      values: |
        nameOverride: backend-chat-service
        fullnameOverride: backend-chat-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-chat-service
          tag: latest
        deploymentAnnotations:
          secret.reloader.stakater.com/reload: backend-chat-service-secret
        service:
          port: 8083
        containerPort: 8083
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/group.name: team9-backend-dev
            alb.ingress.kubernetes.io/group.order: "40"
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            external-dns.alpha.kubernetes.io/hostname: backend.team9.cloud.skala-ai.com
          hosts:
            - host: backend.team9.cloud.skala-ai.com
              paths:
                - path: /api/chat
                  pathType: Prefix
          tls: []
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: dev
          - name: SERVER_CONTEXT_PATH
            value: /api/chat
          - name: ROOM_SERVICE_BASE_URL
            value: http://backend-room-service:8082/api/room
        envFromSecretRefs:
          - backend-chat-service-secret
        externalSecret:
          enabled: true
          targetName: backend-chat-service-secret
          remoteKey: team9-mini/dev/backend/chat-service
          data:
            - secretKey: DB_USER
              remoteRef:
                key: team9-mini-dev-db-03-credentials
                property: username
            - secretKey: DB_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-03-credentials
                property: password
            - secretKey: SPRING_DATASOURCE_USERNAME
              remoteRef:
                key: team9-mini-dev-db-03-credentials
                property: username
            - secretKey: SPRING_DATASOURCE_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-03-credentials
                property: password
            - secretKey: SPRING_REDIS_CLUSTER_NODES
              remoteRef:
                key: team9-mini-dev-redis-pubsub
                property: SPRING_REDIS_CLUSTER_NODES
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

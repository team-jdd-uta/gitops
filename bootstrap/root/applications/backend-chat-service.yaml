apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-chat-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-chat-service
      values: |
        nameOverride: backend-chat-service
        fullnameOverride: backend-chat-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-chat-service
          tag: latest
        ingress:
          enabled: false
        envFromSecretRefs:
          - backend-chat-service-secret
        externalSecret:
          enabled: true
          targetName: backend-chat-service-secret
          remoteKey: team9-mini/dev/backend/chat-service
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

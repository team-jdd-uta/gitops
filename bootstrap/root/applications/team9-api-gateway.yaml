apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team9-api-gateway-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/gateway/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

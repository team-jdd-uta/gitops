apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team9-api-gateway-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/gateway/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true

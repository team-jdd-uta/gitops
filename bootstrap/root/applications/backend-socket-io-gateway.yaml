apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-socket-io-gateway-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-socket-io-gateway
      values: |
        nameOverride: backend-socket-io-gateway
        fullnameOverride: backend-socket-io-gateway
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-socket-io-gateway
          tag: 0b6867312e19
        service:
          port: 3000
        containerPort: 3000
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/group.name: team9-backend-dev
            alb.ingress.kubernetes.io/group.order: "50"
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:881490135253:certificate/15fce3b8-43ed-4555-8d9a-837375603b2e
            alb.ingress.kubernetes.io/success-codes: "200-499"
            external-dns.alpha.kubernetes.io/hostname: backend.team9.cloud.skala-ai.com
          hosts:
            - host: backend.team9.cloud.skala-ai.com
              paths:
                - path: /api/socket
                  pathType: Prefix
          tls: []
        env:
          - name: PORT
            value: "3000"
          - name: SOCKET_PATH
            value: /api/socket
          - name: ROOM_SERVICE_URL
            value: http://backend-room-service:8082/api/room
          - name: CHAT_SERVICE_URL
            value: http://backend-chat-service:8083/api/chat
        envFromSecretRefs:
          - backend-socket-io-gateway-secret
        externalSecret:
          enabled: true
          targetName: backend-socket-io-gateway-secret
          remoteKey: team9-mini/dev/backend/socket-io-gateway
          data:
            - secretKey: REDIS_NODES
              remoteRef:
                key: team9-mini-dev-redis-pubsub
                property: REDIS_NODES
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

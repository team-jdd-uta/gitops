apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-room-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-room-service
      values: |
        nameOverride: backend-room-service
        fullnameOverride: backend-room-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-room-service
          tag: e700acfc0f8d
          pullPolicy: IfNotPresent
        deploymentAnnotations:
          secret.reloader.stakater.com/reload: backend-room-service-secret
        service:
          port: 8082
        containerPort: 8082
        ingress:
          enabled: true
          className: alb
          annotations:
            alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
            alb.ingress.kubernetes.io/ssl-redirect: "443"
            alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:881490135253:certificate/15fce3b8-43ed-4555-8d9a-837375603b2e
            alb.ingress.kubernetes.io/success-codes: "200-499"
            alb.ingress.kubernetes.io/group.name: team9-backend-dev
            alb.ingress.kubernetes.io/group.order: "30"
            alb.ingress.kubernetes.io/scheme: internet-facing
            alb.ingress.kubernetes.io/target-type: ip
            external-dns.alpha.kubernetes.io/hostname: backend.team9.cloud.skala-ai.com
          hosts:
            - host: backend.team9.cloud.skala-ai.com
              paths:
                - path: /api/room
                  pathType: Prefix
          tls: []
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: dev
          - name: SERVER_CONTEXT_PATH
            value: /api/room
          - name: SPRING_REDIS_SSL
            value: "false"
          - name: CORS_ALLOWED_ORIGINS
            value: https://front.team9.cloud.skala-ai.com,http://localhost:*
          - name: SPRING_REDIS_CLUSTER_NODES
            value: team9-mini-dev-redis-pubsub.1spwho.clustercfg.apn2.cache.amazonaws.com:6379
          - name: GATEWAY_AUTH_REQUIRED
            value: "true"
        envFromSecretRefs:
          - backend-room-service-secret
        externalSecret:
          enabled: true
          targetName: backend-room-service-secret
          remoteKey: team9-mini/dev/backend/room-service
          data:
            - secretKey: DB_USER
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: username
            - secretKey: DB_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: password
            - secretKey: SPRING_DATASOURCE_USERNAME
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: username
            - secretKey: SPRING_DATASOURCE_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: password
            - secretKey: RTMP_CALLBACK_SECRET
              remoteRef:
                key: team9-mini/dev/backend/rtmp
                property: RTMP_CALLBACK_SECRET
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

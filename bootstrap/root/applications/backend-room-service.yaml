apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-room-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: feat/gitops-app-paths
    path: apps/backend/dev
    helm:
      releaseName: backend-room-service
      values: |
        nameOverride: backend-room-service
        fullnameOverride: backend-room-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-room-service
          tag: latest
        ingress:
          enabled: false
        envFromSecretRefs:
          - backend-room-service-secret
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

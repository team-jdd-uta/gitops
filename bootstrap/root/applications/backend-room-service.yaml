apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-room-service-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: https://github.com/team-jdd-uta/gitops.git
    targetRevision: main
    path: apps/backend/dev
    helm:
      releaseName: backend-room-service
      values: |
        nameOverride: backend-room-service
        fullnameOverride: backend-room-service
        image:
          repository: 881490135253.dkr.ecr.ap-northeast-2.amazonaws.com/team9-room-service
          tag: latest
        deploymentAnnotations:
          secret.reloader.stakater.com/reload: backend-room-service-secret
        ingress:
          enabled: false
        envFromSecretRefs:
          - backend-room-service-secret
        externalSecret:
          enabled: true
          targetName: backend-room-service-secret
          remoteKey: team9-mini/dev/backend/room-service
          data:
            - secretKey: DB_USER
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: username
            - secretKey: DB_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: password
            - secretKey: SPRING_DATASOURCE_USERNAME
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: username
            - secretKey: SPRING_DATASOURCE_PASSWORD
              remoteRef:
                key: team9-mini-dev-db-02-credentials
                property: password
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

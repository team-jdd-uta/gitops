apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-dev
  namespace: argocd
spec:
  project: team9-dev
  source:
    repoURL: oci://docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.5.9
    helm:
      releaseName: eg
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
